<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>نجم الصف | متابعة الطلاب</title><style>body{font-family:Arial;margin:0;background:#f4f7f7;color:#17302e}header{background:#0b7a70;color:#fff;padding:20px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;padding:18px;margin:12px 0;border-radius:18px;box-shadow:0 4px 15px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button,input,select{padding:12px;border-radius:12px;border:1px solid #ccd8d7;font-size:16px;width:100%;box-sizing:border-box}button{background:#0b7a70;color:#fff;border:0}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>نجم الصف</h1><div>نظام متابعة الطلاب — V2</div></header><main><section class="card"><h2>تسجيل الدخول</h2><input id="name" placeholder="اسم المستخدم"><select id="role"><option>المعلم</option><option>ولي الأمر</option></select><br><br><button onclick="login()">دخول</button><p id="msg">جاهز للربط مع Supabase.</p></section><section class="card"><h2>لوحة المتابعة</h2><div class="grid"><button onclick="show('students')">الطلاب</button><button onclick="show('evaluation')">التقييم 1–10</button><button onclick="show('attendance')">الحضور</button><button onclick="show('notes')">الملاحظات</button></div></section><section id="students" class="card" hidden><h2>الطلاب</h2><p>إدارة الطلاب والصفوف والشعب.</p></section><section id="evaluation" class="card" hidden><h2>التقييم</h2><p>التحصيل — المشاركة — الانضباط — الواجبات — التطور — السلوك.</p></section><section id="attendance" class="card" hidden><h2>الحضور</h2><p>حاضر — غائب — متأخر — بعذر.</p></section><section id="notes" class="card" hidden><h2>الملاحظات</h2><p>ملاحظات مرتبطة بكل طالب.</p></section></main><script>function login(){let n=document.getElementById('name').value.trim();document.getElementById('msg').textContent=n?'مرحباً '+n:'اكتب الاسم أولاً'}function show(id){document.querySelectorAll('main section[id]').forEach(x=>x.hidden=true);document.getElementById(id).hidden=false}</script></body></html>
